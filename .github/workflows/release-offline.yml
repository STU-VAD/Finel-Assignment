name: Release Offline Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/observable/package-lock.json

      - name: Install Python dependencies
        run: cd src/preprocess && uv sync

      - name: Run Python preprocessing
        run: cd src/preprocess && uv run python build.py

      - name: Install Node.js dependencies
        run: cd src/observable && npm ci

      - name: Build Vue app (offline mode)
        run: cd src/observable && npx vite build --config vite.offline.config.ts

      - name: Create release archive
        run: |
          TAG="offline-$(date -u +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV

          cd src/observable/dist
          zip -r "../../../climate-viz-${TAG}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "离线演示版 ${{ env.TAG }}"
          body: |
            🖥️ **离线可视化演示包**

            下载 `climate-viz-${{ env.TAG }}.zip`，解压后直接打开 `index.html` 即可，无需联网。

            **包含内容：**
            - 交互式 3D/2D 气候数据可视化
            - CO₂ 浓度 + 温度异常数据（1979-2025）
            - JetBrains Mono 字体已本地化
          files: climate-viz-${{ env.TAG }}.zip
          generate_release_notes: true
